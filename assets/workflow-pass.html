<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One debugging pass, end to end</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · greek-agent-skills</p>
    <h1>One debugging pass, end to end</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-pass-title workflow-pass-desc">
        <title id="workflow-pass-title">One debugging pass, end to end</title>
        <desc id="workflow-pass-desc">A flowchart of five skills applied to one bug: Socratic questions the diagnosis, Democritean reproduces it, Euclidean gathers evidence, Heraclitean fixes and re-checks, a decision loops back to revise on failure, and Stoic reports honestly before shipping.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Pipeline left to right, along y=236 -->
        <line x1="200" y1="236" x2="248" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="408" y1="236" x2="456" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="616" y1="236" x2="664" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="824" y1="236" x2="864" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Decision PASS down to Stoic (coral happy path) -->
        <line x1="936" y1="292" x2="936" y2="400" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Stoic down to End -->
        <line x1="936" y1="472" x2="936" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Decision FAIL: loop back over the top to Socratic (dashed) -->
        <path d="M936 180 L936 148 Q936 140 928 140 L132 140 Q124 140 124 148 L124 200"
              fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="486" y="120" width="68" height="14" rx="2" fill="#f5f5f5"/>
        <text x="520" y="130" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">REVISE</text>

        <rect x="948" y="156" width="34" height="14" rx="2" fill="#f5f5f5"/>
        <text x="965" y="166" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">FAIL</text>

        <rect x="948" y="330" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="968" y="340" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">PASS</text>

        <!-- Stage 1: Socratic -->
        <rect x="40" y="200" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Socratic</text>
        <text x="120" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">question diagnosis</text>

        <!-- Stage 2: Democritean -->
        <rect x="248" y="200" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="328" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Democritean</text>
        <text x="328" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">minimal repro</text>

        <!-- Stage 3: Euclidean -->
        <rect x="456" y="200" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="536" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Euclidean</text>
        <text x="536" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">evidence for claim</text>

        <!-- Stage 4: Heraclitean -->
        <rect x="664" y="200" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="744" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Heraclitean</text>
        <text x="744" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fix, then re-check</text>

        <!-- Decision diamond -->
        <polygon points="936,180 1008,236 936,292 864,236" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="936" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Checks</text>
        <text x="936" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pass?</text>

        <!-- Stage 5: Stoic -->
        <rect x="856" y="400" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="936" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stoic</text>
        <text x="936" y="450" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">report honestly</text>

        <!-- End oval (coral focal) -->
        <rect x="856" y="520" width="160" height="72" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="936" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shipped</text>
        <text x="936" y="570" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verified + honest</text>

        <!-- Legend -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="666" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · ONE PASS; MOST BUGS NEED ONLY TWO OR THREE STAGES</text>

        <rect x="40" y="682" width="24" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="72" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Skill / step</text>

        <polygon points="196,689 208,682 220,689 208,696" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="230" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <rect x="330" y="682" width="24" height="14" rx="7" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="362" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Done (focal)</text>

        <line x1="470" y1="689" x2="498" y2="689" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="506" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Pass</text>

        <line x1="572" y1="689" x2="600" y2="689" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="608" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Revise loop (on fail)</text>
      </svg>
    </div>
  </div>
</body>
</html>
